name: Birthday Tournament Watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten prüfen
  workflow_dispatch: {}

permissions:
  contents: write   # damit der Workflow state.json zurück committen darf

jobs:
  check-and-create:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Forum prüfen & Turniere erstellen
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: python main.py

      - name: State committen
        run: |
          git config user.name "birthday-bot"
          git config user.email "actions@github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "Update processed post state"
          git push
